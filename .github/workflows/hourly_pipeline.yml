name: NBA Hourly Odds Monitor & Pipeline

on:
  schedule:
    - cron: '*/30 * * * *'  # Runs every 30 minutes
  workflow_dispatch:  # Allow manual trigger

jobs:
  check-and-predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ===== STEP 1: CHECK FOR NEW ODDS =====
      - name: Check for new odds
        id: odds_check
        run: |
          python hourly_odds_checker.py | tee checker_output.txt

          if grep -q "NEW_ODDS_FOUND" checker_output.txt; then
            echo "new_odds=true" >> $GITHUB_OUTPUT

            # Extract new games list for Slack
            NEW_GAMES=$(python3 -c "
          import json
          d = json.load(open('checker_summary.json'))
          print('\n'.join(d['new_games']))
          ")
            echo "new_games<<EOF" >> $GITHUB_OUTPUT
            echo "$NEW_GAMES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT

            NEW_COUNT=$(python3 -c "import json; print(json.load(open('checker_summary.json'))['new_games_count'])")
            echo "new_count=$NEW_COUNT" >> $GITHUB_OUTPUT

            TOTAL=$(python3 -c "import json; print(json.load(open('checker_summary.json'))['total_with_odds'])")
            echo "total_with_odds=$TOTAL" >> $GITHUB_OUTPUT
          else
            echo "new_odds=false" >> $GITHUB_OUTPUT

            TOTAL=$(python3 -c "import json; print(json.load(open('checker_summary.json'))['total_with_odds'])" 2>/dev/null || echo "0")
            echo "total_with_odds=$TOTAL" >> $GITHUB_OUTPUT

            ALREADY=$(python3 -c "import json; print(json.load(open('checker_summary.json'))['already_predicted'])" 2>/dev/null || echo "0")
            echo "already_predicted=$ALREADY" >> $GITHUB_OUTPUT
          fi

      # ===== SLACK: No new odds =====
      - name: Slack - No new odds
        if: steps.odds_check.outputs.new_odds == 'false'
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            -d "$(cat <<SLACK
          {
            "blocks": [
              {
                "type": "header",
                "text": {"type": "plain_text", "text": "NBA Hourly Check - No New Odds"}
              },
              {
                "type": "section",
                "fields": [
                  {"type": "mrkdwn", "text": "*Status:* No new odds found"},
                  {"type": "mrkdwn", "text": "*Time:* $(date -u +'%Y-%m-%d %H:%M UTC')"},
                  {"type": "mrkdwn", "text": "*Games with odds:* ${{ steps.odds_check.outputs.total_with_odds }}"},
                  {"type": "mrkdwn", "text": "*Already predicted:* ${{ steps.odds_check.outputs.already_predicted }}"}
                ]
              },
              {
                "type": "context",
                "elements": [{"type": "mrkdwn", "text": "Pipeline skipped. Next check in 1 hour."}]
              }
            ]
          }
          SLACK
          )"

      # ===== SLACK: New odds found - pipeline starting =====
      - name: Slack - New odds found
        if: steps.odds_check.outputs.new_odds == 'true'
        run: |
          GAMES_FORMATTED=$(echo "${{ steps.odds_check.outputs.new_games }}" | sed 's/^/• /' | tr '\n' '\\' | sed 's/\\/\\n/g')

          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            -d "$(cat <<SLACK
          {
            "blocks": [
              {
                "type": "header",
                "text": {"type": "plain_text", "text": "NBA Hourly Check - New Odds Detected!"}
              },
              {
                "type": "section",
                "fields": [
                  {"type": "mrkdwn", "text": "*New games:* ${{ steps.odds_check.outputs.new_count }}"},
                  {"type": "mrkdwn", "text": "*Time:* $(date -u +'%Y-%m-%d %H:%M UTC')"}
                ]
              },
              {
                "type": "section",
                "text": {"type": "mrkdwn", "text": "*Games:*\n${GAMES_FORMATTED}"}
              },
              {
                "type": "context",
                "elements": [{"type": "mrkdwn", "text": "Running full pipeline: Features -> Odds -> Combine -> Predict -> Save -> Grade"}]
              }
            ]
          }
          SLACK
          )"

      # ===== STEP 2: FULL PIPELINE (only if new odds found) =====
      - name: Step 2a - Fetch pre-match features
        if: steps.odds_check.outputs.new_odds == 'true'
        run: python Pre_Match.py
        continue-on-error: false

      - name: Verify nba_prematch_features.csv
        if: steps.odds_check.outputs.new_odds == 'true'
        run: |
          if [ ! -f "nba_prematch_features.csv" ]; then
            echo "ERROR: nba_prematch_features.csv not found!"
            exit 1
          fi

      - name: Step 2b - Fetch odds
        if: steps.odds_check.outputs.new_odds == 'true'
        run: python Odds_Pre_Match.py
        continue-on-error: false

      - name: Verify upcoming_nba_draftkings_odds.csv
        if: steps.odds_check.outputs.new_odds == 'true'
        run: |
          if [ ! -f "upcoming_nba_draftkings_odds.csv" ]; then
            echo "ERROR: upcoming_nba_draftkings_odds.csv not found!"
            exit 1
          fi

      - name: Step 2c - Combine features and odds
        if: steps.odds_check.outputs.new_odds == 'true'
        run: python Combine.py
        continue-on-error: false

      - name: Verify Future.csv
        if: steps.odds_check.outputs.new_odds == 'true'
        run: |
          if [ ! -f "Future.csv" ]; then
            echo "ERROR: Future.csv not found!"
            exit 1
          fi

      - name: Verify trained models exist
        if: steps.odds_check.outputs.new_odds == 'true'
        run: |
          for file in hybrid_home_xgb.pkl hybrid_away_xgb.pkl hybrid_scaler.pkl; do
            if [ ! -f "model/$file" ]; then
              echo "ERROR: model/$file MISSING"
              exit 1
            fi
          done

      - name: Step 2d - Generate predictions
        if: steps.odds_check.outputs.new_odds == 'true'
        run: python predict.py
        continue-on-error: false

      - name: Verify NBA_PREDICTIONS_ML.csv
        if: steps.odds_check.outputs.new_odds == 'true'
        run: |
          if [ ! -f "NBA_PREDICTIONS_ML.csv" ]; then
            echo "ERROR: NBA_PREDICTIONS_ML.csv not found!"
            exit 1
          fi

      # ===== STEP 3: SAVE TO DATABASE =====
      - name: Step 3a - Save predictions to database
        if: steps.odds_check.outputs.new_odds == 'true'
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: python new_save.py

      - name: Step 3b - Save features to database
        if: steps.odds_check.outputs.new_odds == 'true'
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: python features_store.py

      # ===== STEP 4: GRADE & GAMEKEY =====
      - name: Step 4a - Run grading model
        if: steps.odds_check.outputs.new_odds == 'true'
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: python new_grading_model.py

      - name: Step 4b - Generate game keys
        if: steps.odds_check.outputs.new_odds == 'true'
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: python game_key.py

      # ===== STEP 5: COMMIT & PUSH =====
      - name: Commit and push results
        if: steps.odds_check.outputs.new_odds == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git pull --rebase origin main 2>/dev/null || git pull --rebase origin master 2>/dev/null || true

          git add -f nba_prematch_features.csv 2>/dev/null || true
          git add -f upcoming_nba_draftkings_odds.csv 2>/dev/null || true
          git add -f Future.csv 2>/dev/null || true
          git add -f NBA_PREDICTIONS_ML.csv 2>/dev/null || true

          rm -f new_odds_found.flag checker_summary.json checker_output.txt

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Hourly: NBA predictions (new odds detected) $(date +'%Y-%m-%d %H:%M UTC')"

          max_retries=5
          retry_count=0
          while [ $retry_count -lt $max_retries ]; do
            retry_count=$((retry_count+1))
            if git push origin main 2>&1; then
              exit 0
            elif git push origin master 2>&1; then
              exit 0
            fi
            if [ $retry_count -lt $max_retries ]; then
              sleep 10
              git pull --rebase origin main 2>&1 || git pull --rebase origin master 2>&1 || true
            fi
          done
          exit 1
        continue-on-error: true

      # ===== SLACK: Pipeline completed =====
      - name: Slack - Pipeline completed
        if: steps.odds_check.outputs.new_odds == 'true' && success()
        run: |
          # Build prediction summary from CSV
          PRED_SUMMARY=$(python3 -c "
          import pandas as pd
          df = pd.read_csv('NBA_PREDICTIONS_ML.csv')
          lines = []
          for _, r in df.iterrows():
              winner = r['home_team'] if r['ml_prediction'] == 'Home Win' else r['away_team']
              conf = r['ml_confidence']
              grade = r['grade']
              ou = r['ou_predicted']
              total = int(r['total_points_predicted'])
              lines.append(f\"{r['away_team']} @ {r['home_team']}  |  {winner} ({conf:.0f}% {grade})  |  {ou} {total}pts\")
          print('\n'.join(lines))
          " 2>/dev/null || echo "Could not parse predictions")

          GAME_COUNT=$(python3 -c "import pandas as pd; print(len(pd.read_csv('NBA_PREDICTIONS_ML.csv')))" 2>/dev/null || echo "?")

          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            -d "$(cat <<SLACK
          {
            "blocks": [
              {
                "type": "header",
                "text": {"type": "plain_text", "text": "NBA Predictions Complete"}
              },
              {
                "type": "section",
                "fields": [
                  {"type": "mrkdwn", "text": "*Games predicted:* ${GAME_COUNT}"},
                  {"type": "mrkdwn", "text": "*Time:* $(date -u +'%Y-%m-%d %H:%M UTC')"}
                ]
              },
              {
                "type": "section",
                "text": {"type": "mrkdwn", "text": "*Predictions:*\n\`\`\`\n${PRED_SUMMARY}\n\`\`\`"}
              },
              {
                "type": "context",
                "elements": [{"type": "mrkdwn", "text": "Saved to DB + graded + committed to repo"}]
              }
            ]
          }
          SLACK
          )"

      # ===== SLACK: Pipeline failed =====
      - name: Slack - Pipeline failed
        if: steps.odds_check.outputs.new_odds == 'true' && failure()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            -d "$(cat <<SLACK
          {
            "blocks": [
              {
                "type": "header",
                "text": {"type": "plain_text", "text": "NBA Pipeline FAILED"}
              },
              {
                "type": "section",
                "fields": [
                  {"type": "mrkdwn", "text": "*Status:* Failed"},
                  {"type": "mrkdwn", "text": "*Time:* $(date -u +'%Y-%m-%d %H:%M UTC')"},
                  {"type": "mrkdwn", "text": "*Run:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"}
                ]
              }
            ]
          }
          SLACK
          )"

      - name: Upload predictions as backup artifact
        if: steps.odds_check.outputs.new_odds == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nba-hourly-predictions-${{ github.run_number }}
          path: |
            nba_prematch_features.csv
            upcoming_nba_draftkings_odds.csv
            Future.csv
            NBA_PREDICTIONS_ML.csv
          retention-days: 7
